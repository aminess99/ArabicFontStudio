services:
  - type: web
    name: xfontat
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:push
    startCommand: npm run start
    healthCheckPath: /healthz
    disk:
      name: generated-blog-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_GA_MEASUREMENT_ID
        value: G-PRERSDYJ5N
      - key: GENERATED_POSTS_FILE
        value: /var/data/generatedPosts.json
      - key: DATABASE_URL
        fromDatabase:
          name: xfontat-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: xfontat-postgres
    databaseName: xfontat
    user: xfontat
    plan: basic-256mb
    region: frankfurt
